<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Bakery Pricing &amp; Profit</title>
<meta name="description" content="Price your bakes, track orders and see your profit. Works offline, data stays on your device.">

<style>:root{--page:#F4F5F8;--card:#FFFFFF;--text:#232A33;--muted:#5D6673;--line:#DDE1EA;--band:#477563;--bandt:#FFFFFF;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#12151B;--card:#1A1F28;--text:#EEF1F6;
--muted:#A3ACBB;--line:#2A3140;--band:#243330;--bandt:#EEF1F6;--input:#283F38;--accent:#9AA7E8;--accon:#12151B;
--tint:#252B45;--ok:#A9C7BB;--oktint:#1F3A30;--warn:#E3B77A;--warntint:#3A2C17;--bad:#F28B82;--badtint:#3A2422;

:root[data-theme="dark"]{--page:#12151B;--card:#1A1F28;--text:#EEF1F6;--muted:#A3ACBB;--line:#2A3140;--band:#243330;
--bandt:#EEF1F6;--input:#283F38;--accent:#9AA7E8;--accon:#12151B;--tint:#252B45;--ok:#A9C7BB;--oktint:#1F3A30;

*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--page);padding:14px 0 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:22px;margin:0;flex:1;letter-spacing:-.2px}
.brand{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--band);display:inline-block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.acc{background:var(--tint);border-color:var(--accent)}.kpi.acc .v{color:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.row:first-of-type{border-top:0}
.row .main{flex:1;min-width:0}.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row .amt small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--oktint);color:var(--ok)}.pill.warn{background:var(--warntint);color:var(--warn)}
.pill.bad{background:var(--badtint);color:var(--bad)}.pill.info{background:var(--infotint);color:var(--info)}
.pill.wait{background:var(--waittint);color:var(--muted)}
.btn{border:0;border-radius:999px;padding:12px 18px;min-height:46px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accon)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.plain{background:var(--waittint);color:var(--text)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.block{width:100%}.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1;min-width:130px}
.fab{position:fixed;right:max(16px,calc(50vw - 364px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:11;
border:0;border-radius:999px;padding:14px 20px;background:var(--accent);color:var(--accon);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);cursor:pointer;min-height:50px}
.seg{display:flex;background:var(--waittint);border-radius:999px;padding:4px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:9px 8px;min-height:40px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;min-height:38px;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--accent);color:var(--accon);border-color:var(--accent)}
label.f{display:block;margin:0 0 12px}label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:11px 12px;min-height:46px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--tint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.grid3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0 8px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--page);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .bar{position:sticky;top:0;background:var(--page);display:flex;align-items:center;gap:8px;padding:10px 0;z-index:2}
.sheet .bar h3{flex:1;margin:0;font-size:18px}.x{border:0;background:var(--waittint);border-radius:999px;width:40px;height:40px;font-size:20px;cursor:pointer}
.break{font-variant-numeric:tabular-nums}.break div{display:flex;justify-content:space-between;padding:5px 0;border-top:1px dashed var(--line)}
.break div:first-child{border-top:0}.break .big{font-size:18px;font-weight:700;border-top:1px solid var(--line)}
.muted{color:var(--muted)}.small{font-size:13px}.right{text-align:right}.mono{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--muted);height:100%}
.bars b{display:block;width:100%;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.meter{height:10px;border-radius:999px;background:var(--waittint);overflow:hidden;margin:6px 0}.meter b{display:block;height:100%;background:var(--bar)}
.line{display:grid;grid-template-columns:1.6fr .8fr .8fr 34px;gap:6px;align-items:start;margin-bottom:8px}
.line .x{width:34px;height:46px;border-radius:10px}.line .note{grid-column:1/-1;font-size:12px;margin-top:-4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:var(--text);color:var(--page);padding:10px 16px;border-radius:999px;z-index:30;font-size:14px}
.welcome{text-align:center;padding:24px 8px}.welcome h2{text-transform:none;font-size:22px;color:var(--text);letter-spacing:0}
.quote{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.quote h4{margin:0 0 4px;font-size:20px}
.warnbox{background:var(--warntint);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}

<noscript>This app needs JavaScript turned on.</noscript>
<script>/* Home Bakery Pricing & Profit: the same math as the spreadsheet (spec 4 to 6).
   Plain functions over the app state, no DOM. Works in the browser (window.Calc) and in Node (tests). */
(function (root) {
  "use strict";
  var CUP = 236.588;
  var EPS = 1e-9;

  function num(x) { var n = Number(x); return isFinite(n) && x !== "" && x !== null && x !== undefined ? n : 0; }
  function isNum(x) { return x !== "" && x !== null && x !== undefined && isFinite(Number(x)); }
  function round(x, d) { var f = Math.pow(10, d === undefined ? 2 : d); return Math.round((x + (x < 0 ? -EPS : EPS)) * f) / f; }
  function byId(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function unit(state, u) {
    for (var i = 0; i < state.units.length; i++) if (state.units[i].u === u) return state.units[i];
    return null;
  }
  // a date "2026-11-10" -> day number, so dates compare and subtract like the sheet's serials
  function day(s) { if (!s) return null; var p = String(s).split("-"); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000; }
  function iso(d) { var t = new Date(d * 86400000); return t.toISOString().slice(0, 10); }
  function today() { var t = new Date(); return iso(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / 86400000); }

  // ---- ingredients
  function ingInfo(state, ing) {
    var u = unit(state, ing.unit);
    var ok = u && num(ing.size) > 0 && isNum(ing.price);
    return { kind: u ? u.kind : "", factor: u ? num(u.f) : 0,
             perBase: ok ? num(ing.price) / (num(ing.size) * num(u.f)) : null,
             base: u ? (u.kind === "weight" ? "g" : u.kind === "volume" ? "ml" : "piece") : "" };
  }

  // ---- recipe lines: amount in the ingredient's base unit, or a problem text
  function lineInfo(state, line) {
    var ing = byId(state.ingredients, line.ingId);
    if (!ing) return { base: null, cost: null, problem: "Pick an ingredient" };
    var u = unit(state, line.unit);
    if (!u) return { base: null, cost: null, problem: "Unit not in Settings" };
    if (!isNum(line.qty)) return { base: null, cost: null, problem: "Quantity" };
    var ii = ingInfo(state, ing), base = null;
    if (u.kind === ii.kind) base = num(line.qty) * num(u.f);
    else if (u.kind === "volume" && ii.kind === "weight" && isNum(ing.gpc)) base = num(line.qty) * num(u.f) / CUP * num(ing.gpc);
    else return { base: null, cost: null, problem: u.kind === "volume" && ii.kind === "weight" ?
      "Add grams per cup to " + ing.name : "This unit does not fit " + ing.name };
    if (ii.perBase === null) return { base: base, cost: null, problem: ing.name + " has no price" };
    return { base: base, cost: base * ii.perBase, problem: "" };
  }

  function recipeInfo(state, rec) {
    var cost = 0, problems = 0;
    (rec.lines || []).forEach(function (l) { var li = lineInfo(state, l); if (li.problem) problems++; cost += li.cost || 0; });
    var y = num(rec.yield);
    return { cost: cost, perPiece: y > 0 ? cost / y : null, problems: problems, lines: (rec.lines || []).length };
  }

  // ---- products (Price List)
  function productInfo(state, p) {
    var s = state.settings, rec = p.recipeId ? byId(state.recipes, p.recipeId) : null;
    var pieces = isNum(p.pieces) ? num(p.pieces) : 1;
    var ri = rec ? recipeInfo(state, rec) : null;
    var ing = ri && ri.perPiece !== null ? pieces * ri.perPiece : 0;
    var labour = num(p.mins) / 60 * num(s.rate);
    var over = s.overType === "Per item" ? num(s.overhead) : ing * num(s.overhead);
    var money = ing + num(p.pack) + num(p.deco) + over;
    var full = money + labour;
    var step = num(s.step) > 0 ? num(s.step) : 0.01;
    var sugg = full > 0 ? Math.ceil((full * (1 + num(s.markup)) - EPS) / step) * step : 0;
    sugg = round(sugg, 2);
    var used = isNum(p.price) ? num(p.price) : sugg;
    var profit = used - money;
    var perHour = num(p.mins) > 0 ? profit / (num(p.mins) / 60) : null;
    var flag = used < money - EPS ? "under-cost" : used < full - EPS ? "under-rate" : "ok";
    return { ing: ing, labour: labour, over: over, money: money, full: full, sugg: sugg, used: used,
             profit: profit, perHour: perHour, afterPay: used - full, flag: flag, recipe: rec, pieces: pieces };
  }

  // ---- orders
  function orderStatus(state, o, asOf) {
    if (o.status) return o.status;
    return o.pickup && day(o.pickup) <= day(asOf) ? "Delivered" : "Confirmed";
  }
  function orderInfo(state, o, asOf) {
    asOf = asOf || today();
    var p = byId(state.products, o.productId), pi = p ? productInfo(state, p) : null;
    var st = orderStatus(state, o, asOf);
    var off = st === "Cancelled" || st === "Enquiry";
    var price = isNum(o.price) ? num(o.price) : (pi ? pi.used : 0);
    var total = round(num(o.qty) * price + num(o.extras) - num(o.discount) + num(o.delivery));
    var paid = o.paidOn ? total : num(o.deposit);
    var balance = off ? 0 : round(total - paid);
    var sales = st === "Cancelled" ? num(o.deposit) : st === "Enquiry" ? 0 : total;
    var costEach = isNum(o.costEach) ? num(o.costEach) : (pi ? pi.money : 0);
    var cost = off ? 0 : round(num(o.qty) * costEach);
    var hours = off || !p ? 0 : num(o.qty) * num(p.mins) / 60;
    var open = st === "Confirmed" || st === "Baked";
    var days = open && o.pickup ? day(o.pickup) - day(asOf) : null;
    var pill;
    if (st === "Cancelled" || st === "Enquiry") pill = { t: st, k: "wait" };
    else if (st === "Delivered") pill = balance > 0 ? { t: "▲ Balance due", k: "bad" } : { t: "✓ Paid", k: "ok" };
    else if (days === null) pill = { t: "Booked", k: "info" };
    else if (days < 0) pill = { t: "▲ Past pickup", k: "bad" };
    else if (days === 0) pill = { t: "● Today", k: "warn" };
    else if (days <= num(state.settings.dueDays)) pill = { t: "● In " + days + (days === 1 ? " day" : " days"), k: "warn" };
    else pill = { t: "Booked", k: "info" };
    return { status: st, product: p, price: price, total: total, paid: paid, balance: balance, sales: sales,
             cost: cost, profit: round(sales - cost), hours: hours, days: days, open: open, pill: pill };
  }

  // ---- shopping list for confirmed orders in the next N days
  function shopping(state, asOf, days) {
    asOf = asOf || today();
    days = days === undefined ? num(state.settings.shopDays) : days;
    var a = day(asOf), b = a + days, batches = {};
    state.orders.forEach(function (o) {
      var oi = orderInfo(state, o, asOf);
      if (!oi.open || !o.pickup || !oi.product) return;
      var d = day(o.pickup);
      if (d < a || d > b) return;
      var p = oi.product, rec = p.recipeId ? byId(state.recipes, p.recipeId) : null;
      if (!rec || !(num(rec.yield) > 0)) return;
      var pieces = isNum(p.pieces) ? num(p.pieces) : 1;
      batches[rec.id] = (batches[rec.id] || 0) + num(o.qty) * pieces / num(rec.yield);
    });
    var need = {};
    state.recipes.forEach(function (rec) {
      if (!batches[rec.id]) return;
      (rec.lines || []).forEach(function (l) {
        var li = lineInfo(state, l);
        if (li.base !== null) need[l.ingId] = (need[l.ingId] || 0) + li.base * batches[rec.id];
      });
    });
    return state.ingredients.map(function (ing) {
      var ii = ingInfo(state, ing), n = need[ing.id] || 0, packs = null, buy = null, label = "";
      if (n > 0 && ii.factor > 0 && num(ing.size) > 0) {
        packs = round(n / (num(ing.size) * ii.factor), 2);
        if (isNum(ing.onHand)) { buy = Math.max(0, Math.ceil(packs - num(ing.onHand) - EPS)); label = buy > 0 ? "Buy " + buy : "✓ Enough"; }
        else label = "Needed";
      } else if (isNum(ing.onHand) && isNum(ing.lowAt) && num(ing.onHand) <= num(ing.lowAt)) label = "Low";
      return { ing: ing, needBase: n, packs: packs, buy: buy, label: label, base: ii.base };
    }).filter(function (x) { return x.label; });
  }

  // ---- totals for a date range (pickup date), like the Dashboard (running costs are not in the app)
  function totals(state, from, to, asOf) {
    var a = day(from), b = day(to), t = { sales: 0, cost: 0, profit: 0, hours: 0, orders: 0, cancelled: 0, total: 0 };
    state.orders.forEach(function (o) {
      if (!o.pickup) return;
      var d = day(o.pickup);
      if (d < a || d > b) return;
      var oi = orderInfo(state, o, asOf);
      if (oi.status === "Enquiry") return;
      t.sales += oi.sales; t.cost += oi.cost; t.profit += oi.profit; t.hours += oi.hours;
      if (oi.status === "Cancelled") t.cancelled++; else { t.orders++; t.total += oi.total; }
    });
    t.sales = round(t.sales); t.cost = round(t.cost); t.profit = round(t.profit);
    t.perHour = t.hours > 0 ? round(t.profit / t.hours) : null;
    return t;
  }

  var Calc = { num: num, isNum: isNum, round: round, byId: byId, day: day, iso: iso, today: today, ingInfo: ingInfo,
               lineInfo: lineInfo, recipeInfo: recipeInfo, productInfo: productInfo, orderInfo: orderInfo,
               shopping: shopping, totals: totals };
  if (typeof module !== "undefined" && module.exports) module.exports = Calc; else root.Calc = Calc;
})(this);

<script>/* Home Bakery Pricing & Profit app: UI. Data stays on this device (IndexedDB, localStorage fallback). */
(function () {
  "use strict";
  var C = window.Calc, SAMPLE = window.SAMPLE_DATA;
  var KEY = "bakery-app-state-v1";
  var STATUSES = ["Enquiry", "Confirmed", "Baked", "Delivered", "Cancelled"];
  var S = null;                       // the state
  var view = { tab: "today", orderFilter: "upcoming", priceSeg: "products", ingSeg: "shop", moreSeg: "numbers",
               numbers: "month", q: "" };
  var $app = document.getElementById("app");

  // ---------------------------------------------------------------- storage
  var store = (function () {
    var dbp = null;
    function db() {
      if (dbp) return dbp;
      dbp = new Promise(function (res, rej) {
        try {
          var r = indexedDB.open("bakery-app", 1);
          r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
          r.onsuccess = function () { res(r.result); };
          r.onerror = function () { rej(r.error); };
        } catch (e) { rej(e); }
      });
      return dbp;
    }
    function get() {
      return db().then(function (d) {
        return new Promise(function (res, rej) {
          var q = d.transaction("kv").objectStore("kv").get(KEY);
          q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { rej(q.error); };
        });
      }).catch(function () { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } });
    }
    function set(v) {
      try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ }
      return db().then(function (d) {
        return new Promise(function (res) {
          var t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, KEY);
          t.oncomplete = function () { res(); }; t.onerror = function () { res(); };
        });
      }).catch(function () {});
    }
    return { get: get, set: set };
  })();
  function save() { S.savedAt = new Date().toISOString(); store.set(S); }

  // ---------------------------------------------------------------- helpers
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var nf2 = new Intl.NumberFormat(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var nf0 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
  function money(x) { return (S.settings.currency || "") + nf2.format(x || 0); }
  function n2(x) { return nf0.format(x || 0); }
  function parseNum(v) { if (v === "" || v == null) return null; var n = Number(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; }
  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  var DEC = (1.5).toLocaleString().indexOf(",") >= 0 ? "," : ".";
  function fmtDate(s, withDay) {
    if (!s) return "";
    var d = new Date(C.day(s) * 86400000);
    return d.toLocaleDateString(undefined, withDay ? { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" } :
      { year: "numeric", month: "short", day: "numeric", timeZone: "UTC" });
  }
  function asOf() { return C.today(); }
  function pill(p) { return '<span class="pill ' + p.k + '">' + esc(p.t) + "</span>"; }
  function flagPill(f) {
    return f === "ok" ? pill({ t: "✓ OK", k: "ok" }) : f === "under-rate" ? pill({ t: "● Under your rate", k: "warn" }) :
      pill({ t: "▲ Under cost", k: "bad" });
  }
  function toast(t) {
    var d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 2200);
  }
  function opts(list, sel, blank) {
    return (blank !== undefined ? '<option value="">' + esc(blank) + "</option>" : "") + list.map(function (o) {
      var v = typeof o === "string" ? o : o.v, t = typeof o === "string" ? o : o.t;
      return '<option value="' + esc(v) + '"' + (String(v) === String(sel == null ? "" : sel) ? " selected" : "") + ">" + esc(t) + "</option>";
    }).join("");
  }
  function field(label, html) { return '<label class="f"><span>' + esc(label) + "</span>" + html + "</label>"; }
  function inp(name, val, type, extra) {
    type = type || "text";
    var im = type === "num" ? ' inputmode="decimal"' : "";
    if (type === "num") { type = "text"; val = val == null ? "" : String(val).replace(".", DEC); }
    return '<input class="i" name="' + name + '" type="' + type + '" value="' + esc(val == null ? "" : val) + '"' + im + (extra || "") + ">";
  }
  function form(el) {
    var o = {};
    el.querySelectorAll("[name]").forEach(function (x) { o[x.name] = x.type === "checkbox" ? x.checked : x.value; });
    return o;
  }
  function sorted(list, key) { return list.slice().sort(function (a, b) { return String(a[key] || "").localeCompare(String(b[key] || "")); }); }

  // ---------------------------------------------------------------- icons
  var IC = {
    today: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    orders: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>',
    price: '<svg viewBox="0 0 24 24"><path d="M3 12l9-9h8v8l-9 9z"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>',
    ing: '<svg viewBox="0 0 24 24"><path d="M5 9h14l-1.5 11h-11z"/><path d="M8 9a4 4 0 0 1 8 0"/></svg>',
    more: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
  };

  // ---------------------------------------------------------------- render
  function render() {
    if (!S) return;
    var body = { today: renderToday, orders: renderOrders, price: renderPrice, ing: renderIng, more: renderMore }[view.tab]();
    var titles = { today: "Today", orders: "Orders", price: "Price it", ing: "Ingredients", more: "Numbers" };
    $app.innerHTML = '<div class="app"><header class="top"><h1>' + titles[view.tab] + '</h1><div class="brand"><i></i>Bakery Pricing &amp; Profit</div></header>' +
      body + "</div>" + nav() + ((view.tab === "today" || view.tab === "orders") && S.products.length ? '<button class="fab" data-a="new-order">+ Order</button>' : "") +
      (view.tab === "price" ? '<button class="fab" data-a="' + (view.priceSeg === "products" ? "new-product" : "new-recipe") + '">+ ' + (view.priceSeg === "products" ? "Product" : "Recipe") + "</button>" : "") +
      (view.tab === "ing" && view.ingSeg === "all" ? '<button class="fab" data-a="new-ing">+ Ingredient</button>' : "");
  }
  function nav() {
    var t = [["today", "Today"], ["orders", "Orders"], ["price", "Price it"], ["ing", "Ingredients"], ["more", "Numbers"]];
    return '<nav class="tabs"><div class="in">' + t.map(function (x) {
      return '<button data-a="tab" data-v="' + x[0] + '" class="' + (view.tab === x[0] ? "on" : "") + '">' + IC[x[0]] + x[1] + "</button>";
    }).join("") + "</div></nav>";
  }

  function monthRange(off) {
    var t = new Date(), y = t.getFullYear(), m = t.getMonth() + (off || 0);
    var a = new Date(Date.UTC(y, m, 1)), b = new Date(Date.UTC(y, m + 1, 0));
    return [a.toISOString().slice(0, 10), b.toISOString().slice(0, 10), a];
  }

  function orderRow(o) {
    var oi = C.orderInfo(S, o, asOf()), p = oi.product;
    return '<div class="row" data-a="edit-order" data-id="' + o.id + '"><div class="main"><div class="t">' + esc(o.customer || "No name") +
      " · " + esc(p ? p.name : "No product") + (o.qty > 1 ? " ×" + o.qty : "") + '</div><div class="sub">' + fmtDate(o.pickup, true) +
      (o.time ? " · " + esc(o.time) : "") + " · " + pill(oi.pill) + '</div></div><div class="amt">' + money(oi.total) +
      (oi.balance > 0 ? "<small>" + money(oi.balance) + " due</small>" : "<small>" + esc(oi.status) + "</small>") + "</div></div>";
  }

  function renderToday() {
    if (!S.orders.length && !S.products.length) return welcome();
    var r = monthRange(0), t = C.totals(S, r[0], r[1], asOf()), a = asOf(), ad = C.day(a);
    var up = S.orders.filter(function (o) { var oi = C.orderInfo(S, o, a); return oi.open && o.pickup && C.day(o.pickup) >= ad && C.day(o.pickup) <= ad + 7; })
      .sort(function (x, y) { return (x.pickup + (x.time || "")).localeCompare(y.pickup + (y.time || "")); });
    var due = S.orders.filter(function (o) { var oi = C.orderInfo(S, o, a); return oi.status === "Delivered" && oi.balance > 0; });
    var late = S.orders.filter(function (o) { var oi = C.orderInfo(S, o, a); return oi.open && o.pickup && C.day(o.pickup) < ad; });
    var shop = C.shopping(S, a), buy = shop.filter(function (x) { return x.label.indexOf("Buy") === 0 || x.label === "Needed"; });
    var mname = r[2].toLocaleDateString(undefined, { month: "long", timeZone: "UTC" });
    var ph = t.perHour, rate = C.num(S.settings.rate);
    var h = '<p class="muted small" style="margin:-4px 0 12px">' + fmtDate(a, true) + "</p>";
    h += '<div class="kpis"><div class="kpi"><div class="l">Sales, ' + esc(mname) + '</div><div class="v">' + money(t.sales) + '</div><div class="s">' + t.orders + " orders</div></div>" +
      '<div class="kpi"><div class="l">Profit from orders</div><div class="v">' + money(t.profit) + '</div><div class="s">before running costs</div></div>' +

  function renderNumbers() {
    var t0 = new Date(), y = t0.getFullYear(), a = asOf(), from, to, label;
    if (view.numbers === "month") { var r = monthRange(0); from = r[0]; to = r[1]; label = "This month"; }
    else if (view.numbers === "last") { var r2 = monthRange(-1); from = r2[0]; to = r2[1]; label = "Last month"; }
    else { from = y + "-01-01"; to = y + "-12-31"; label = "This year"; }
    var t = C.totals(S, from, to, a), rate = C.num(S.settings.rate);
    var h = '<div class="chips">' + [["month", "This month"], ["last", "Last month"], ["year", "This year"]].map(function (c) {
      return '<button data-a="nper" data-v="' + c[0] + '" class="' + (view.numbers === c[0] ? "on" : "") + '">' + c[1] + "</button>"; }).join("") + "</div>";
    h += '<div class="kpis"><div class="kpi"><div class="l">Sales</div><div class="v">' + money(t.sales) + '</div><div class="s">' + t.orders + " orders · " + t.cancelled + ' cancelled</div></div>' +
      '<div class="kpi"><div class="l">Profit from orders</div><div class="v">' + money(t.profit) + '</div><div class="s">before running costs</div></div>' +
      '<div class="kpi acc"><div class="l">Earned per hour</div><div class="v">' + (t.perHour === null ? "–" : money(t.perHour)) + '</div><div class="s">goal ' + money(rate) + '</div></div>' +
      '<div class="kpi"><div class="l">Hours worked</div><div class="v">' + n2(Math.round(t.hours * 10) / 10) + '</div><div class="s">average order ' + money(t.orders ? t.total / t.orders : 0) + "</div></div></div>";
    var months = [], max = 0;
    for (var m = 0; m < 12; m++) {
      var a1 = new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10), b1 = new Date(Date.UTC(y, m + 1, 0)).toISOString().slice(0, 10);
      var p = C.totals(S, a1, b1, a).profit; months.push(p); if (p > max) max = p;
    }
    h += '<div class="card"><h2>Profit by month · ' + y + '</h2><div class="bars">' + months.map(function (p, i) {
      return '<div><b style="height:' + (max > 0 ? Math.max(0, p) / max * 100 : 0) + '%"></b>' + "JFMAMJJASOND"[i] + "</div>"; }).join("") + "</div></div>";
    var by = {};
    S.orders.forEach(function (o) {
      if (!o.pickup || C.day(o.pickup) < C.day(from) || C.day(o.pickup) > C.day(to)) return;
      var oi = C.orderInfo(S, o, a); if (!oi.product || oi.status === "Enquiry") return;
      by[oi.product.name] = (by[oi.product.name] || 0) + oi.profit;
    });
    var top = Object.keys(by).map(function (k) { return [k, by[k]]; }).sort(function (x, z) { return z[1] - x[1]; }).slice(0, 5);
    h += '<div class="card"><h2>Top products · ' + label + "</h2>" + (top.length ? top.map(function (x) {
      return '<div class="row" style="cursor:default"><div class="main"><div class="t">' + esc(x[0]) + '</div><div class="meter"><b style="width:' + (top[0][1] > 0 ? Math.max(0, x[1]) / top[0][1] * 100 : 0) + '%"></b></div></div><div class="amt">' + money(x[1]) + "</div></div>"; }).join("") : '<div class="empty">No orders in this period.</div>') + "</div>";
    var yt = C.totals(S, y + "-01-01", a, a), cap = C.num(S.settings.cap);
    h += '<div class="card"><h2>Yearly sales limit</h2>' + (cap > 0 ? '<div class="mono">' + money(yt.sales) + " of " + money(cap) + '</div><div class="meter"><b style="width:' + Math.min(100, yt.sales / cap * 100) + '%"></b></div><div class="small muted">' +
      (yt.sales >= cap ? "▲ Limit reached." : yt.sales >= cap * C.num(S.settings.warnPct) ? "● Getting close." : "✓ Below your limit.") + " Check your own local rules.</div>" :

    h += '<div class="card"><h2>Tax set-aside guide</h2><div class="mono">' + money(Math.max(0, t.profit) * C.num(S.settings.taxPct)) + '</div><div class="small muted">' + Math.round(C.num(S.settings.taxPct) * 100) +
      "% of " + label.toLowerCase() + "'s profit from orders, before running costs. The spreadsheet's Tax Set-Aside tab includes running costs. A savings habit, not tax advice.</div></div>";
    return h;
  }

    var units = S.units.map(function (u) { return u.u; });
    function linesHtml() {
      return r.lines.map(function (l, i) {
        var li = l.ingId ? C.lineInfo(S, l) : { problem: "", cost: null };
        return '<div class="line" data-i="' + i + '"><select class="i" name="ing' + i + '">' + opts(ings, l.ingId, "Ingredient") + "</select>" + inp("qty" + i, l.qty, "num", ' placeholder="Qty"') +
          '<select class="i" name="unit' + i + '">' + opts(units, l.unit) + '</select><button class="x" data-a="del-line" data-i="' + i + '" aria-label="Remove">×</button>' +
          '<div class="note ' + (li.problem ? "" : "muted") + '" style="' + (li.problem ? "color:var(--bad)" : "") + '">' + (li.problem ? esc(li.problem) : li.cost === null ? "" : money(li.cost)) + "</div></div>";
      }).join("");
    }
    var html = '<div id="rf">' + '<div class="grid2">' + field("Recipe name", inp("name", r.name)) + field("Makes (pieces)", inp("yield", r.yield, "num")) + "</div>" +
      '<div id="lines">' + linesHtml() + '</div><button class="btn plain block" data-a="add-line">+ Ingredient line</button>' +
      '<div class="card break" id="rsum" style="margin-top:12px"></div><div class="btns"><button class="btn" data-a="save-recipe">Save</button>' +
      (r.id ? '<button class="btn danger" data-a="del-recipe" data-id="' + r.id + '">Delete</button>' : "") + "</div></div>";
    openSheet(r.id ? "Edit recipe" : "New recipe", html, function (b) {
      var f = b.querySelector("#rf");
      function read() { var v = form(f); r.name = (v.name || "").trim(); r.yield = parseNum(v.yield);
        r.lines.forEach(function (l, i) { l.ingId = v["ing" + i] || ""; l.qty = parseNum(v["qty" + i]); l.unit = v["unit" + i]; }); }
      function upd(full) { read(); if (full) b.querySelector("#lines").innerHTML = linesHtml(); else b.querySelectorAll(".line").forEach(function (el, i) {
          var l = r.lines[i], li = l.ingId ? C.lineInfo(S, l) : { problem: "", cost: null }, n = el.querySelector(".note");
          n.textContent = li.problem || (li.cost === null ? "" : money(li.cost)); n.style.color = li.problem ? "var(--bad)" : ""; });
        var ri = C.recipeInfo(S, { yield: r.yield, lines: r.lines.filter(function (l) { return l.ingId; }) });
        b.querySelector("#rsum").innerHTML = "<div><span>Ingredient cost (batch)</span><b>" + money(ri.cost) + '</b></div><div class="big"><span>Cost per piece</span><span>' + (ri.perPiece === null ? "–" : money(ri.perPiece)) + "</span></div>"; }
      f.addEventListener("input", function () { upd(false); }); f.addEventListener("change", function () { upd(false); });
      f.addEventListener("click", function (e) {
        var a = e.target.closest("[data-a]"); if (!a) return;
        if (a.dataset.a === "add-line") { read(); r.lines.push({ ingId: "", qty: null, unit: "g" }); upd(true); e.stopPropagation(); }
        if (a.dataset.a === "del-line") { read(); r.lines.splice(+a.dataset.i, 1); if (!r.lines.length) r.lines.push({ ingId: "", qty: null, unit: "g" }); upd(true); e.stopPropagation(); }
        if (a.dataset.a === "save-recipe") { read(); e.stopPropagation();
          if (!r.name) return toast("Give the recipe a name.");
          if (!(r.yield > 0)) return toast("How many pieces does it make?");
          if (S.recipes.some(function (x) { return x.name === r.name && x.id !== r.id; })) return toast("That name is already used.");
          r.lines = r.lines.filter(function (l) { return l.ingId && l.qty !== null; });
          if (r.id) S.recipes[S.recipes.findIndex(function (x) { return x.id === r.id; })] = r; else { r.id = uid("r"); S.recipes.push(r); }
          save(); closeSheet(); render(); toast("Recipe saved"); }
      });
      upd(false);
    });
  }

  function ingEditor(id) {
    var g = id ? C.byId(S.ingredients, id) : { id: null, unit: "g" };
    var units = S.units.map(function (u) { return u.u; });
    var html = '<div id="gf">' + field("Ingredient", inp("name", g.name)) +
      '<div class="grid3">' + field("Pack size", inp("size", g.size, "num")) + field("Unit", '<select class="i" name="unit">' + opts(units, g.unit) + "</select>") + field("Pack price", inp("price", g.price, "num")) + "</div>" +
      '<div class="grid2">' + field("Grams per cup (dry, optional)", inp("gpc", g.gpc, "num")) + field("Where you buy it", inp("supplier", g.supplier)) + "</div>" +
      '<div class="grid2">' + field("Packs on hand (optional)", inp("onHand", g.onHand, "num")) + field("Low at (packs, optional)", inp("lowAt", g.lowAt, "num")) + "</div>" +
      '<p class="small muted" id="gsum"></p><div class="btns"><button class="btn" data-a="save-ing" data-id="' + (g.id || "") + '">Save</button>' + (g.id ? '<button class="btn danger" data-a="del-ing" data-id="' + g.id + '">Delete</button>' : "") + "</div></div>";
    openSheet(g.id ? "Edit ingredient" : "New ingredient", html, function (b) {
      var f = b.querySelector("#gf");
      function upd() { var d = ingFromForm(form(f), g), ii = C.ingInfo(S, d);
        b.querySelector("#gsum").textContent = ii.perBase === null ? "Fill in pack size, unit and price." : "Costs " + (S.settings.currency || "") + ii.perBase.toFixed(4) + " per " + ii.base + ". Every recipe using it updates when you save."; }
      f.addEventListener("input", upd); f.addEventListener("change", upd); upd();
    });
  }
  function ingFromForm(v, g) {
    var d = Object.assign({}, g);
    d.name = (v.name || "").trim(); d.unit = v.unit; d.supplier = v.supplier || null;
    ["size", "price", "gpc", "onHand", "lowAt"].forEach(function (k) { d[k] = parseNum(v[k]); });
    return d;
  }

  function quote(id) {
    var o = C.byId(S.orders, id), oi = C.orderInfo(S, o, asOf()), p = oi.product;
    var lines = [(o.customer || "") , (p ? p.name : "") + (o.qty > 1 ? " × " + o.qty : "") + " · " + money(oi.price) + " each"];
    if (C.num(o.extras)) lines.push("Extras: " + money(o.extras));
    if (C.num(o.discount)) lines.push("Discount: −" + money(o.discount));
    if (C.num(o.delivery)) lines.push("Delivery: " + money(o.delivery));
    lines.push("Total: " + money(oi.total), "Paid: " + money(oi.paid), (oi.status === "Enquiry" ? "To pay: " + money(C.round(oi.total - oi.paid)) : "Balance due: " + money(oi.balance)));
    if (o.pickup) lines.push("Pickup: " + fmtDate(o.pickup, true) + (o.time ? " " + o.time : ""));
    var html = '<div class="quote"><h4>' + esc(o.customer || "Order") + '</h4><div class="muted small">' + esc(o.pickup ? "Pickup " + fmtDate(o.pickup, true) + (o.time ? " · " + o.time : "") : "") +
      '</div><div class="break" style="margin-top:12px">' + lines.slice(1).map(function (l) { var i = l.indexOf(": "); return i > 0 ? "<div><span>" + esc(l.slice(0, i)) + "</span><b>" + esc(l.slice(i + 2)) + "</b></div>" : "<div><span>" + esc(l) + "</span></div>"; }).join("") +
      '</div></div><div class="btns"><button class="btn" data-a="copy-text">Copy as text</button></div><p class="small muted">Or take a screenshot to send it.</p>';
    openSheet("Order summary", html, function (b) {
      b.querySelector('[data-a="copy-text"]').addEventListener("click", function (e) { e.stopPropagation(); copy(lines.join("\n")); });
    });
  }

  // ---------------------------------------------------------------- export, backup
  function copy(text) {
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast("Copied"); }, function () {
      var t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); toast("Copied"); } catch (e) { toast("Copy did not work: select and copy by hand"); } t.remove(); });
  }
  function download(name, text, type) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function orderTable(sep) {
    var nfmt = function (x) { return x == null || x === "" ? "" : String(x).replace(".", DEC); };
    return S.orders.slice().sort(function (a, b) { return (a.pickup || "").localeCompare(b.pickup || ""); }).map(function (o) {
      var p = C.byId(S.products, o.productId);
      return [o.ordered, o.customer, o.contact, o.pickup, o.time, p ? p.name : "", nfmt(o.qty), nfmt(o.price), nfmt(o.extras), nfmt(o.discount),
        nfmt(o.delivery), nfmt(o.deposit), o.depositOn, o.paidOn, o.status, o.channel, nfmt(o.costEach), o.notes].map(function (v) {
        v = v == null ? "" : String(v);
        if (sep === "\t") return v.replace(/[\t\n]/g, " ");
        return /[",;\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(sep);
    }).join("\n");
  }

  // ---------------------------------------------------------------- actions
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-a]"); if (!a) return;
    var act = a.dataset.a, id = a.dataset.id, v = a.dataset.v;
    var panel = sheetEl && sheetEl.querySelector(".body");
    switch (act) {
      case "tab": view.tab = v; window.scrollTo(0, 0); render(); break;
      case "ofilter": view.orderFilter = v; render(); break;
      case "pseg": view.priceSeg = v; render(); break;
      case "iseg": view.ingSeg = v; render(); break;
      case "mseg": view.moreSeg = v; render(); break;
      case "nper": view.numbers = v; render(); break;
      case "close": closeSheet(); break;
      case "new-order": if (!S.products.length) { toast("Add a product first (Price it)."); break; } orderEditor(null); break;
      case "edit-order": orderEditor(id); break;
      case "new-product": productEditor(null); break;
      case "edit-product": productEditor(id); break;
      case "new-recipe": if (!S.ingredients.length) { toast("Add ingredients first."); break; } recipeEditor(null); break;
      case "edit-recipe": recipeEditor(id); break;
      case "new-ing": ingEditor(null); break;
      case "edit-ing": ingEditor(id); break;
      case "quote": quote(id); break;
      case "save-order": case "mark-delivered": {
        var cur = id ? C.byId(S.orders, id) : {};
        var d = orderFromForm(form(panel.querySelector("#of")), cur);
        if (!d.productId) return toast("Pick a product.");
        if (!d.pickup) return toast("Add the pickup date.");
        if (!(d.qty > 0)) return toast("Qty must be more than 0.");
        if (act === "mark-delivered") { d.status = "Delivered"; if (!d.paidOn) d.paidOn = asOf(); }
        if (C.orderInfo(S, d, asOf()).status === "Delivered") freezeCost(d);
        if (id) S.orders[S.orders.findIndex(function (x) { return x.id === id; })] = d; else { d.id = uid("o"); S.orders.push(d); }
        save(); closeSheet(); render(); toast(act === "mark-delivered" ? "Marked delivered and paid" : "Order saved"); break; }
      case "del-order": if (confirm("Delete this order?")) { S.orders = S.orders.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); } break;
      case "save-product": {
        var cp = id ? C.byId(S.products, id) : {};
        var pd = productFromForm(form(panel.querySelector("#pf")), cp);
        if (!pd.name) return toast("Give the product a name.");
        if (S.products.some(function (x) { return x.name === pd.name && x.id !== pd.id; })) return toast("That name is already used.");
        if (id) S.products[S.products.findIndex(function (x) { return x.id === id; })] = pd; else { pd.id = uid("p"); S.products.push(pd); }
        save(); closeSheet(); render(); toast("Product saved"); break; }
      case "del-product":
        if (S.orders.some(function (o) { return o.productId === id; })) { toast("Orders use this product: it stays."); break; }
        if (confirm("Delete this product?")) { S.products = S.products.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); } break;
      case "del-recipe":
        if (S.products.some(function (p) { return p.recipeId === id; })) { toast("A product uses this recipe: it stays."); break; }
        if (confirm("Delete this recipe?")) { S.recipes = S.recipes.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); } break;
      case "save-ing": {
        var cg = id ? C.byId(S.ingredients, id) : {};
        var gd = ingFromForm(form(panel.querySelector("#gf")), cg);
        if (!gd.name) return toast("Give the ingredient a name.");
        if (S.ingredients.some(function (x) { return x.name === gd.name && x.id !== gd.id; })) return toast("That name is already used.");
        if (id) S.ingredients[S.ingredients.findIndex(function (x) { return x.id === id; })] = gd; else { gd.id = uid("i"); S.ingredients.push(gd); }
        save(); closeSheet(); render(); toast("Ingredient saved"); break; }
      case "del-ing":
        if (S.recipes.some(function (r) { return r.lines.some(function (l) { return l.ingId === id; }); })) { toast("A recipe uses this ingredient: it stays."); break; }
        if (confirm("Delete this ingredient?")) { S.ingredients = S.ingredients.filter(function (x) { return x.id !== id; }); save(); closeSheet(); render(); } break;
      case "save-settings": {
        var sv = form(document.getElementById("setf")), s = S.settings;
        s.currency = (sv.currency || "").slice(0, 6);
        var num = function (k, def) { var x = parseNum(sv[k]); return x === null ? def : x; };
        s.rate = num("rate", 0); s.markup = num("markup", 0) / 100; s.step = num("step", 0.5) || 0.5; s.overType = sv.overType;
        s.overhead = s.overType === "Per item" ? num("overhead", 0) : num("overhead", 0) / 100;
        s.shopDays = Math.max(0, Math.round(num("shopDays", 7))); s.dueDays = Math.max(0, Math.round(num("dueDays", 3)));
        s.cap = parseNum(sv.cap); s.taxPct = num("taxPct", 20) / 100;
        S.channels = sv.channels.split("\n").map(function (x) { return x.trim(); }).filter(Boolean);
        save(); render(); toast("Settings saved"); break; }
      case "theme": S.theme = v || null; applyTheme(); save(); render(); break;
      case "backup": S.lastBackup = new Date().toISOString(); save();
        download("bakery-backup-" + asOf() + ".json", JSON.stringify(S), "application/json"); break;
      case "restore": document.getElementById("restoreFile").click(); break;
      case "copy-orders": copy(orderTable("\t")); break;
      case "csv-orders": download("bakery-orders-" + asOf() + ".csv", "﻿" + orderTable(DEC === "," ? ";" : ","), "text/csv"); break;
      case "load-sample": if (!S.orders.length || confirm("Replace everything on this device with the sample bakery?")) { S = JSON.parse(JSON.stringify(SAMPLE)); shiftSample(S); save(); view.tab = "today"; render(); } break;
      case "start-empty": S = emptyState(); save(); view.tab = "ing"; view.ingSeg = "all"; render(); toast("Start with your ingredients"); break;
      case "clear-all": if (confirm("Delete all your orders, products, recipes and ingredients on this device? Make a backup first.")) { S = emptyState(); save(); render(); } break;
    }
  });
  document.addEventListener("input", function (e) { if (e.target.dataset && e.target.dataset.a === "search") { view.q = e.target.value; var pos = e.target.selectionStart; render(); var s = document.querySelector('[data-a="search"]'); s.focus(); s.setSelectionRange(pos, pos); } });
  document.addEventListener("change", function (e) {
    if (e.target.id !== "restoreFile" || !e.target.files[0]) return;
    var r = new FileReader();
    r.onload = function () { try { var d = JSON.parse(r.result); if (!d || !d.settings || !Array.isArray(d.orders)) throw 0;
        if (confirm("Replace everything on this device with this backup?")) { S = d; save(); applyTheme(); render(); toast("Backup restored"); } }
      catch (x) { toast("That file is not a backup from this app."); } };
    r.readAsText(e.target.files[0]);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  // ---------------------------------------------------------------- state
  function emptyState() {
    var s = JSON.parse(JSON.stringify(SAMPLE));
    s.ingredients = []; s.recipes = []; s.products = []; s.orders = []; s.sample = false;
    return s;
  }
  // the sample's dates are moved so its "today" (Nov 10, 2026) is the real today
  function shiftSample(s) {
    var delta = C.day(C.today()) - C.day(s.sampleAsOf || "2026-11-10");
    ["ordered", "pickup", "depositOn", "paidOn"].forEach(function (k) {
      s.orders.forEach(function (o) { if (o[k]) o[k] = C.iso(C.day(o[k]) + delta); });
    });
    s.sample = true;
  }
  function applyTheme() { if (S && S.theme) document.documentElement.setAttribute("data-theme", S.theme); else document.documentElement.removeAttribute("data-theme"); }

  store.get().then(function (d) {
    S = d && d.settings ? d : emptyState();
    applyTheme(); render();
    if (S.lastBackup && C.day(C.today()) - C.day(S.lastBackup.slice(0, 10)) > 14 && S.orders.length) setTimeout(function () { toast("Tip: no backup for 2 weeks (Numbers > Settings & backup)"); }, 1200);
  });
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body></html>
